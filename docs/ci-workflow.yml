# Referencia de GitHub Actions CI (.github/workflows/ci.yml)
# Nota: También ubicado en `.github/workflows/ci.yml` en el repositorio local.
# Para que `scripts/github_sync.py` publique directamente en `.github/workflows/ci.yml`,
# el Personal Access Token (PAT) debe contar con el scope `workflow` además de `repo`.

name: Yedid Smart Hub — Security & Isolated Audit Suite

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  isolated-tests:
    name: Run Security Audit & Isolated Unit Tests
    runs-on: ubuntu-latest
    env:
      YEDID_TEST_MODE: "1"
      YEDID_TOKEN: "ci_test_only_token_non_secret"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pre-push security & AST audit
        run: |
          python scripts/github_sync.py --audit

      - name: Run isolated unit, concurrency, and regression test suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
